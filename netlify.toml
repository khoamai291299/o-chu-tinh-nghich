# Cấu hình triển khai Netlify cho trò chơi (Vite + React, chạy hoàn toàn ở phía trình duyệt)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Các file đã băm tên (assets/*) cache lâu; index.html luôn lấy bản mới
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
